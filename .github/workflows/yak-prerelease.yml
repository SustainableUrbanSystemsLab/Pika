name: Yak prerelease

on:
  workflow_dispatch:
    inputs:
      beta_number:
        description: Beta number for the current project version
        type: number
        default: 1
        required: true
      publish:
        description: Publish to Yak and create a GitHub prerelease
        type: boolean
        default: false
      build_run_id:
        description: Successful build-only run ID containing the tested package
        type: string
        default: ""

permissions:
  actions: read
  contents: write

jobs:
  package:
    uses: ./.github/workflows/yak-package.yml
    with:
      channel: pre-release
      beta_number: ${{ inputs.beta_number }}
      publish: ${{ inputs.publish }}
      build_run_id: ${{ inputs.build_run_id }}
    secrets:
      YAK_TOKEN: ${{ secrets.YAK_TOKEN_PATRICK }}
