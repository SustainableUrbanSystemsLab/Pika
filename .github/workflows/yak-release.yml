name: Yak release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Yak and create a stable GitHub release
        type: boolean
        default: false
      build_run_id:
        description: Successful build-only run ID containing the tested package
        type: string
        default: ""

permissions:
  actions: read
  contents: write

jobs:
  package:
    uses: ./.github/workflows/yak-package.yml
    with:
      channel: release
      publish: ${{ inputs.publish }}
      build_run_id: ${{ inputs.build_run_id }}
    secrets:
      YAK_TOKEN: ${{ secrets.YAK_TOKEN_PATRICK }}
