name: Yak Release

# One workflow for both channels, as in Eddy3D: a push to `release` publishes the stable
# X.Y.Z to Yak, and a push to `pre-release` publishes X.Y.Z-beta.N (the next unused N).
# workflow_dispatch from either branch does the same. A dispatch from any other ref is refused.

on:
  push:
    branches:
      - release
      - pre-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref_name == 'release' || github.ref_name == 'pre-release'
    uses: ./.github/workflows/yak-package.yml
    with:
      channel: ${{ github.ref_name }}
      publish: true
    secrets:
      YAK_TOKEN: ${{ secrets.YAK_TOKEN_PATRICK }}
